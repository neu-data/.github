# Neudata · R project / package check
name: R check

on:
  push:
    branches: [ $default-branch ]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Lint
        run: Rscript -e 'if (requireNamespace("lintr", quietly = TRUE)) lintr::lint_dir(".")'
      - name: Run tests
        run: Rscript -e 'if (dir.exists("tests/testthat")) testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
